<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion — PARAGUASMJ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body class="bg-login d-flex align-items-center justify-content-center min-vh-100">

<div class="card shadow-lg" style="max-width:420px;width:100%;">
    <div class="card-header bg-asuacap text-white text-center py-4">
        <i class="bi bi-droplet-half fs-1 text-info d-block mb-2"></i>
        <h4 class="fw-bold mb-0">ASUACAP</h4>
        <small class="opacity-75">Sistema Integrado de Gestion Documental</small>
    </div>
    <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} mb-3">{{ msg }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('autenticacion.login') }}" novalidate>
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="bi bi-person me-1"></i>Usuario
                </label>
                <input type="text" name="usuario" class="form-control form-control-lg"
                       placeholder="nombre_usuario" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">
                    <i class="bi bi-lock me-1"></i>Contrasena
                </label>
                <div class="input-group">
                    <input type="password" name="clave" class="form-control form-control-lg"
                           placeholder="••••••••" autocomplete="current-password" required id="campo-clave">
                    <button class="btn btn-outline-secondary" type="button"
                            onclick="togglePass()">
                        <i class="bi bi-eye" id="icono-ojo"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Sistema
            </button>
        </form>
    </div>
    <div class="card-footer text-center text-muted small py-3">
        <i class="bi bi-shield-lock me-1"></i>
        Villeta, Cundinamarca &middot; PARAGUASMJ
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePass(){
    const f=document.getElementById("campo-clave");
    const i=document.getElementById("icono-ojo");
    if(f.type==="password"){ f.type="text"; i.classList.replace("bi-eye","bi-eye-slash"); }
    else { f.type="password"; i.classList.replace("bi-eye-slash","bi-eye"); }
}
</script>
</body>
</html>
