{% extends "base.html" %}
{% block title %}Error {{ codigo }} — SIGCA{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="display-1 text-muted fw-bold">{{ codigo }}</div>
        <h3 class="mt-3">{{ mensaje }}</h3>
        <p class="text-muted">Lo sentimos, ha ocurrido un error en el sistema.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-3">
            <i class="bi bi-house me-2"></i>Volver al Panel
        </a>
    </div>
</div>
{% endblock %}
