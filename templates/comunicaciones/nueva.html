{% extends "base.html" %}
{% block title %}Nueva Comunicacion{% endblock %}
{% block content %}
<div class="modulo-header modulo-documental">
    <i class="bi bi-envelope-plus-fill"></i>
    <span>Registrar Comunicación Recibida</span>
    <span class="modulo-user"><i class="bi bi-person-circle me-1"></i>{{ session.nombre_completo }}</span>
</div>
<div class="row justify-content-center">
    <div class="col-md-7">
        <h5 class="mb-3"><i class="bi bi-envelope-plus me-2"></i>Registrar Comunicacion Recibida</h5>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold">Entidad Remitente <span class="text-danger">*</span></label>
                            <input type="text" name="entidad_remitente" class="form-control" required placeholder="Ej: CAR, Alcaldia de Villeta, SSPD...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Radicado externo</label>
                            <input type="text" name="radicado_externo" class="form-control" placeholder="Numero de radicado del remitente">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Fecha de Recepcion</label>
                            <input type="date" name="fecha_recepcion" class="form-control" value="{{ hoy }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Asunto <span class="text-danger">*</span></label>
                            <input type="text" name="asunto" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check mt-3">
                                <input class="form-check-input" type="checkbox" name="requiere_respuesta" id="req-resp" value="1">
                                <label class="form-check-label" for="req-resp">Requiere respuesta</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Plazo de respuesta (dias)</label>
                            <input type="number" name="dias_plazo" class="form-control" value="15" min="1" max="90">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Observaciones</label>
                            <textarea name="observaciones" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary fw-bold">
                            <i class="bi bi-floppy me-1"></i>Registrar Comunicacion
                        </button>
                        <a href="{{ url_for('comunicaciones.listar') }}" class="btn btn-outline-secondary ms-2">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
