{% extends "base.html" %}
{% block title %}Nueva Lectura Macromedicion{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h5 class="mb-3"><i class="bi bi-plus me-2"></i>Registrar Lectura Macromedidor</h5>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Fecha <span class="text-danger">*</span></label>
                        <input type="date" name="fecha" class="form-control" value="{{ hoy }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Lectura Inicial (m³)</label>
                        <input type="number" name="lectura_inicial" class="form-control" step="0.01" min="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Lectura Final (m³)</label>
                        <input type="number" name="lectura_final" class="form-control" step="0.01" min="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Observaciones</label>
                        <input type="text" name="observaciones" class="form-control" maxlength="200">
                    </div>
                    <button type="submit" class="btn btn-primary fw-bold w-100">
                        <i class="bi bi-floppy me-1"></i>Guardar Lectura
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
