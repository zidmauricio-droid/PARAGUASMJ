{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h5 class="mb-3"><i class="bi bi-kanban me-2"></i>{{ titulo }}</h5>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Codigo <span class="text-danger">*</span></label>
                            <input type="text" name="codigo" class="form-control" required placeholder="PRY-2026-001">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Descripcion</label>
                            <textarea name="descripcion" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Fecha inicio</label>
                            <input type="date" name="fecha_inicio" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Fecha limite</label>
                            <input type="date" name="fecha_limite" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Presupuesto (COP)</label>
                            <input type="number" name="presupuesto" class="form-control" step="1000" min="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Estado</label>
                            <select name="estado" class="form-select">
                                {% for e in ['En Proceso','Completado','Pausado','Cancelado'] %}
                                <option>{{ e }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary fw-bold">
                            <i class="bi bi-floppy me-1"></i>Guardar
                        </button>
                        <a href="{{ url_for('proyectos.listar') }}" class="btn btn-outline-secondary ms-2">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
